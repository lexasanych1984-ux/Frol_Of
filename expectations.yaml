# ── Коридоры бэктеста: система раннего предупреждения о деградации эджа ────────
#
# Здесь зафиксированы ОЖИДАНИЯ из бэктестов — «коридоры нормы» по каждой
# стратегии. `python run.py report` сравнивает с ними ФАКТ демо-форвард-теста и
# ставит пометки OK / ВНИМАНИЕ / ПРОБЛЕМА.
#
# Источники (держать в синхроне при правках стратегий):
#   • SMC-портфель-финал.md              — итоговая таблица WR/RR/PF 5 потоков
#   • portfolio-live-operations.md        — боевой регламент, ожидания
#   • daily-sweep-strategy.md             — CRT Day 1H (deep 9.3 года, помесячно)
#
# ВАЖНО про чтение коридоров:
#   • диапазоны — НЕ жёсткие пороги, а «коридор нормы». Выход за него что-то
#     значит ТОЛЬКО при достаточной выборке (n >= min_sample). При n меньше —
#     отчёт честно пишет «мало данных, выводы преждевременны» и НЕ тревожит.
#   • FX-ядро даёт ~1.5–2.5 сделки в месяц СУММАРНО — по одному месяцу вывод о
#     WR/PF сделать нельзя почти никогда; смысл появляется на накопленной истории.
#
# Поля, помеченные «# ⚠ ОЦЕНКА» — выведены мной, точного числа в документах нет.
# Их надо сверить и поправить (см. сопроводительное сообщение).

meta:
  # Ниже этого числа сделок по стратегии отчёт не делает выводов о WR/PF/сериях.
  min_sample: 20
  # Немедленная тревога, если ФАКТИЧЕСКИЙ риск сделки превысил заданный больше
  # чем на столько процентных пунктов (напр. цель 2.0% → факт > 2.3%).
  risk_overshoot_pp: 0.3

strategies:

  # ── SMC «2-е колено» (FX-ядро: EURUSD + GBPJPY, три потока под одним magic) ──
  # В демо три SMC-потока сливаются в одну стратегию «SMC» (magic 770001),
  # поэтому коридоры даны на СУММУ потоков.
  smc:
    label: SMC                     # как называется в отчёте и истории MT5
    instruments: [EURUSD, GBPJPY]
    risk_pct: 2.0                  # боевой риск на сделку
    win_rate: [0.27, 0.50]         # потоки 32.8% / 37.1% / ~37%; портфельный коридор 27–50%
    profit_factor: [1.40, 1.85]    # GBPJPY 1.43–1.60 … EURUSD ~1.80
    trades_per_month: [1.0, 3.0]   # ~1.5–2.5 суммарно по трём потокам; месяцы без сделок — норма
    be_share: [0.00, 0.05]         # SMC без безубытка — БУ-исходов практически нет
    max_stop_streak: 6             # «серии из 3–5 стопов подряд — норма», редко до 6
    worst_month_pct: -8.0          # ⚠ ОЦЕНКА: DD на худшем окне GBPJPY 15.7%, помесячного нет

  # ── CRT Day 1H (GER40) ──────────────────────────────────────────────────────
  # Механика с безубытком: две трети исходов «пустые» (БУ) — это НОРМА, не сбой.
  crt:
    label: CRT
    instruments: [GER40]
    risk_pct: 1.0
    win_rate: [0.18, 0.25]         # TP-исходы ~21% (deep 9.3 года)
    profit_factor: [1.60, 2.00]    # deep PF 1.85; RR-плато робастно
    trades_per_month: [3.0, 7.0]   # ~5 сделок/мес
    be_share: [0.20, 0.35]         # ~25% чистых БУ; «пустых» исходов ~2/3
    max_stop_streak: 7             # ⚠ ОЦЕНКА: win~21%+БУ~25%, точной серии в доке нет
    worst_month_pct: -3.6          # худший месяц бэктеста (42 мес), макс 2 минуса подряд

  # ── Asia Sweep (индексы: GER40 + NAS100, один magic 770003 = «ASIA») ─────────
  asweep:
    label: ASIA
    instruments: [GER40, NAS100]
    risk_pct: 1.0
    win_rate: [0.38, 0.42]         # GER40 38.5% / NAS100 41.6%
    profit_factor: [1.25, 1.45]    # 1.29 … 1.42
    trades_per_month: [3.0, 4.0]   # 3.2 … 3.6 на инструмент (в демо суммарно ~6–7)
    be_share: [0.00, 0.05]         # тейк = край Азии, безубыток не используется
    max_stop_streak: 10            # ⚠ ОЦЕНКА: WR~40% на ~200 сделок, точной серии в доке нет
    worst_month_pct: -11.8         # худшее окно NAS100 −11.8%; яма GER40 апр24–авг25
