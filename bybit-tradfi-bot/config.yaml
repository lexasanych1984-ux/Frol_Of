# Конфигурация bybit-tradfi-bot. Скопируй в config.yaml и подгони под себя.

# ── Карта символов: TradingView-тикер (из syminfo.ticker) → символ MT5 Bybit ──
# У Bybit TradFi символы часто с суффиксом ".s". Проверь точные имена в терминале
# (Market Watch → правый клик → Symbols) и впиши сюда. Если тикера тут нет —
# бот попробует автоподбор по префиксу, но лучше задать явно.
symbol_map:
  # Just2Trade-MT5 demo (счёт 245169). Индексы — группа Indices,
  # мини-контракты: лот целый (1..300), 1 пункт индекса ≈ 1 EUR/USD на лот.
  EURUSD: "EURUSD"
  GBPJPY: "GBPJPY"
  GER40:  "GER30m"      # описание "DAX" — это DAX40/GER40
  NAS100: "USTECH100m"  # US Tech 100 mini

# ── Риск-менеджмент ──────────────────────────────────────────────────────────
risk:
  # % от equity счёта на сделку. Должен совпадать с riskPct в стратегии.
  # Базовое значение — для стратегий, не перечисленных в per_strategy.
  risk_pct_per_trade: 1.0
  # Переопределение риска по стратегии (ключ как в magic-карте: smc|crt|asweep).
  # В TradingView SMC задеплоен на 2% (in_0=2), CRT Day и Asia Sweep — на 1%.
  per_strategy:
    smc:
      risk_pct_per_trade: 2.0
  # Если рассчитанный лот меньше минимального у символа — пропустить сделку
  # (true) или взять минимальный лот (false, БОЛЬШЕ риск!).
  skip_if_below_min_lot: true
  # Максимальное плечо-ограничение на позицию (страховка от опечатки в SL).
  # 25 — под индексные мини Just2Trade (GER30m/USTECH100m: ~1 USD/пункт/лот,
  # для 1% риска на 100k при SL 80-120 пунктов нужно 8-12 лотов).
  max_lot_per_trade: 25.0

# ── Защиты / kill-switch ─────────────────────────────────────────────────────
guards:
  max_open_positions_total: 5      # всего одновременно
  max_open_positions_per_symbol: 1 # по одному символу
  # Дневной стоп: если реализованный убыток за день превысил % от equity начала
  # дня — бот перестаёт открывать новые сделки до следующего дня.
  daily_max_loss_pct: 5.0
  # Разрешать только эти символы (пусто = все из symbol_map).
  allowed_symbols: []
  # Дедуп: сколько секунд считать одинаковый сигнал повтором и игнорировать.
  # 900 (15 мин) покрывает разъезд быстрого CDP и надёжного webhook-канала: один
  # и тот же fire приходит обоими путями, второй отбрасывается по хэшу содержимого.
  dedup_window_sec: 900

# ── Обработка сигналов выхода ────────────────────────────────────────────────
exits:
  # Что делать на алерт "ВЫХОД ..." (обычный, не БУ).
  # ignore | close  (close = рыночное закрытие позиции по символу)
  #
  # 2026-08-01: ignore -> close. Раньше игнорировать было безопасно: у SMC/CRT
  # выход шёл только по SL/TP, которые уже висят на ордере, и брокер закрывал сам.
  # С v25 появился ТРЕТИЙ выход — тайм-стоп maxHoldH=42 ("ВЫХОД long по тайм-стопу
  # EURUSD"): TradingView закрывает позицию по рынку, а в MT5 триггера на это нет.
  # При ignore такая позиция висела бы до SL/TP — ровно та патология (удержание до
  # 41 дня), ради которой тайм-стоп и вводился. В боевой ячейке это 15% сделок.
  # На обычных SL/TP-выходах close безвреден: позиции у брокера уже нет,
  # close_position фильтрует по magic и вернёт "нет позиции".
  on_exit_alert: close
  # Что делать на алерт "(после БУ)" — перенос стопа в безубыток.
  # ignore | move_sl_to_entry
  on_breakeven: move_sl_to_entry

# ── Свежесть сигналов (защита протухших) ─────────────────────────────────────
# Возраст сигнала = сейчас − когда он сработал (метка из облачного буфера/CDP).
# После простоя бот добирает сигналы из облачного буфера — вход по устаревшей цене
# исполнять нельзя. ВАЖНО: фильтр применяется ТОЛЬКО к market-входу (цена ушла →
# риск раздувается). Отложенный вход (limit/stop, весь CRT) стоит на фикс. уровне
# и НЕ фильтруется по возрасту — он просто ждёт цену; отмену идеи ловит "ОТМЕНА".
signal_freshness:
  entry_max_age_sec: 600      # MARKET-ВХОД старше 10 мин — не исполнять, уведомить и пропустить
  manage_max_age_sec: 21600   # БУ/ВЫХОД/ОТМЕНА — до 6 ч (позиция/ордер уже есть)
  # per_strategy:              # переопределение entry_max_age по стратегии (только market)
  #   crt:
  #     entry_max_age_sec: 900

# ── Отложенные ордера (CRT) ──────────────────────────────────────────────────
# CRT-вход — отложенный (stop/limit): фильтр свежести к нему не применяется, но
# сам он GTC и не отменится. Инвалидацию идеи снимает alert "CRT ОТМЕНА …" из
# стратегии (точно, интрадей). Экспирация ниже — БЭКСТОП на случай, если бот был
# офлайн и пропустил отмену. Безопасно деградирует к gtc, если брокер режим не
# поддерживает или время истечения уже близко (мгновенной потери входа не будет).
pending_orders:
  # gtc: живёт до отмены | day: сгорает в конце торгового дня брокера |
  # window: экспирация в конце окна CRT (window_end по window_tz)
  expire: window
  window_end: "2300"          # конец окна пробоя CRT (сессия стратегии 1000-2300)
  window_tz: "Europe/Moscow"

# ── Часы торговли (локальное время ПК). Пусто = без ограничения. ──────────────
# Формат "HHMM-HHMM", можно несколько окон. Внутри стратегий сессии уже есть,
# это дополнительная страховка на стороне бота.
trading_hours: []

# ── Логирование ──────────────────────────────────────────────────────────────
logging:
  level: INFO        # DEBUG | INFO | WARNING | ERROR
  file: logs/bot.log
